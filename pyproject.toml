[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "huske"
version = "0.12.0"
description = "Always-on terminal audio recorder + local transcription (Parakeet / Whisper on Apple Silicon)"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tiago Moraes" }]
keywords = ["audio", "transcription", "whisper", "terminal", "tui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
]
dependencies = [
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "numpy>=1.26",
    # Transcription backends (Apple Silicon / MLX). Parakeet is the default
    # engine; mlx-whisper stays available via `asr_engine = "whisper"`.
    "parakeet-mlx>=0.5; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # Built-in LLM distillation backend (`distill_backend = "mlx"`, the
    # default): huske runs the model itself in an isolated subprocess — no
    # external daemon. Rides the same MLX/Metal stack as transcription.
    "mlx-lm>=0.22; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # Used by the engines to resample 48 kHz capture to the 16 kHz both models
    # want, without shelling out to ffmpeg. Small, ships wheels for Apple Silicon.
    "soxr>=0.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "rich>=13.7",
    "typer>=0.12",
    "pydantic>=2.6",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "tomli-w>=1.0",
    # Show the process as "huske" in Activity Monitor / ps instead of "Python".
    # >=1.3.5 carries the macOS Dock-icon / fork-after fixes (see huske/proctitle.py).
    "setproctitle>=1.3.5",
    # System audio capture on macOS via ScreenCaptureKit (macOS 13+).
    "pyobjc-framework-ScreenCaptureKit>=10; sys_platform == 'darwin'",
    "pyobjc-framework-CoreMedia>=10; sys_platform == 'darwin'",
    # System audio via Core Audio process tap (macOS 14.4+).
    "pyobjc-framework-CoreAudio>=10; sys_platform == 'darwin'",
]

[project.urls]
Homepage = "https://github.com/tiagomoraes/huske"
Repository = "https://github.com/tiagomoraes/huske"
Issues = "https://github.com/tiagomoraes/huske/issues"
Changelog = "https://github.com/tiagomoraes/huske/blob/develop/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]
# Local semantic search + MCP server (`huske index` / `huske mcp`). Opt-in:
# embedding rides the MLX/Metal stack mlx-whisper already ships, the vector
# store is a zero-dependency SQLite extension, and `mcp` is the official SDK.
# See docs/adr/0001-0003 and CONTEXT.md (Passage).
mcp = [
    "mlx-embeddings>=0.1.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sqlite-vec>=0.1.6",
    # Capped below 2.0: the SDK's 2.0 line renamed `mcp.server.fastmcp.FastMCP`
    # to `mcp.server.mcpserver.MCPServer`, so an unpinned install resolves to an
    # SDK `huske mcp` cannot import. CI installs only `.[dev]`, which means no
    # test would have caught it — the cap is what keeps a fresh
    # `pip install 'huske[mcp]'` working. Lift it with the 2.0 port, not before.
    "mcp>=1.12,<2",
    "uvicorn>=0.30",
]
# Off-device huske server (`huske serve` + the loopback `huske mcp` read side),
# installed on the VPS. No Metal there, so embeddings run on `fastembed`
# (onnxruntime, CPU) — the documented non-Metal fallback from
# docs/adr/0002-local-search-stack.md, made load-bearing in 0004. The send side
# (`huske run` / `huske sync`) ships in the base install and needs no extra.
server = [
    "fastembed>=0.3",
    "sqlite-vec>=0.1.6",
    "mcp>=1.12,<2",  # same 2.0 import break as the `mcp` extra above
    "uvicorn>=0.30",
]

[project.scripts]
huske = "huske.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["huske"]

[tool.hatch.build.targets.sdist]
include = [
    "/CHANGELOG.md",
    "/CODE_OF_CONDUCT.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/README.md",
    "/SECURITY.md",
    "/SUPPORT.md",
    "/THIRD_PARTY_NOTICES.md",
    "/docs",
    "/examples",
    "/huske",
    "/pyproject.toml",
    "/specs",
    "/tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
# Typer's idiomatic API uses `typer.Option(...)` / `typer.Argument(...)` as
# argument defaults, which trips B008 (function-call-in-default-argument).
"huske/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: end-to-end tests using fake audio sources",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
