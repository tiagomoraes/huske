[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "huske-mcp"
version = "0.1.0"
description = "Always-on, resource-efficient MCP service for Huske transcript replicas"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.26,<3",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
semantic = [
    "model2vec>=0.6",
    "numpy>=1.26",
]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
huske-mcp = "huske_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["huske_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
