# Transcription models Huske offers by name (`huske models`, Huske.app).
#
# Adding a model of an existing family is one entry here — no code. The family
# must be registered in huske/transcribe/engines/__init__.py (today: parakeet,
# whisper). Check before adding: the repo loads with that family's runtime
# (`huske models try <repo>` transcribes a sample and prints the speed), and
# give the measured speed so people can compare. See docs/transcription-models.md.
#
# Fields
#   id          stable handle people type (`huske models use <id>`); never reuse
#   family      parakeet | whisper (a registered engine family)
#   repo        Hugging Face repo (or a local folder)
#   name        display name
#   summary     one plain sentence: what it's good at
#   languages   ISO 639-1 codes it transcribes; omit = every language the family knows
#   size_mb     download size (weights), MB
#   speed       fastest | fast | moderate | slow
#   accuracy    basic | good | very good | best
#   measured    how fast it ran on a reference Mac (synthetic speech, warm model)
#   note        anything people must know before choosing it
#   default     the model used when nothing is configured (exactly one)
#   recommended suggested for its use case
#
# Measured 2026-11-22 on an M3 Pro, macOS 27.2, synthetic speech: 52 s of
# Portuguese meeting talk dense with English jargon (and 35 s of English for
# English-only models), counting how many of 10 jargon terms came out right.

[[model]]
id = "parakeet-tdt-0.6b-v3"
family = "parakeet"
repo = "mlx-community/parakeet-tdt-0.6b-v3"
name = "Parakeet v3"
summary = "Fast and quiet on silence; 25 European languages, recognised automatically."
languages = ["bg", "hr", "cs", "da", "nl", "en", "et", "fi", "fr", "de", "el", "hu", "it", "lv", "lt", "mt", "pl", "pt", "ro", "sk", "sl", "es", "sv", "ru", "uk"]
size_mb = 2508
speed = "fastest"
accuracy = "very good"
measured = "51x real time on an M3 Pro; 5 of 10 jargon terms right in Portuguese, 9 in English"
note = "Can't be told the language: mixed Portuguese and English can slip into English."
default = true
recommended = true

