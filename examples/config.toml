# Example huske configuration file.
# Copy to ~/.config/huske/config.toml to apply globally; CLI flags still win.

# Chunk duration in minutes (1–60). Default: 15.
chunk_minutes = 15

# Where transcripts go.
output_root = "~/huske/transcripts"

# Where transient audio chunks live (deleted post-transcription unless keep_audio = true).
audio_root = "~/huske/audio"

# Whisper-class model size: tiny | base | small | medium | large-v3
# Loaded on first use from the matching mlx-community/whisper-<size>-mlx repo.
model = "base"

# Compute type — kept for back-compat; the mlx-whisper backend always uses
# Metal. Setting "float32" disables fp16 inference (slower, more memory). Any
# other value is treated as "use the fp16 default".
compute_type = "int8"

# Inference device — kept for back-compat; mlx-whisper always runs on the
# Apple Silicon GPU. "cuda" is rejected on macOS.
device = "auto"

# Unload the Whisper model from memory between chunks to lower idle RAM. When
# true, the model is dropped after `whisper_idle_unload_seconds` of inactivity
# and reloaded (from the local cache, no network) on the next chunk — freeing
# ~150 MB for `base` up to ~3 GB for `large-v3` while idle. Off by default so
# live transcription stays warm; the reload costs a few seconds on the first
# chunk after an idle gap. Equivalent CLI flag: `huske run --idle-unload`.
# whisper_idle_unload = true
# whisper_idle_unload_seconds = 120

# Optional language hint, ISO 639-1. Omit for auto-detect.
# language = "pt"

# Microphone device name (substring match). System audio is independent of
# this setting.
# input_device = "MacBook Pro Microphone"

# System audio backend: auto | tap | sck | off
# auto uses the Core Audio process tap on macOS 14.4+ so screen sharing in
# Google Meet/Zoom/etc. does not interrupt capture. Older macOS versions fall
# back to ScreenCaptureKit.
system_audio_backend = "auto"

# Keep raw WAV chunks after successful transcription.
keep_audio = false

# Logging: DEBUG | INFO | WARNING | ERROR
log_level = "INFO"

# Run without the Rich live UI (plain log lines instead).
no_ui = false

# Show a macOS menu bar icon while recording (macOS only). Default: true.
# The menu bar runs as a separate helper process (~50-80 MB RSS) plus a small
# control socket and accept thread. Set false (or pass `huske run
# --no-menu-bar`) to skip all of it for the lightest recording footprint when
# you don't need the at-a-glance menu bar status.
# menu_bar_enabled = false

# Periodic screenshots — disabled by default. Captures a JPEG of every
# attached display every `screenshots_interval_seconds` seconds (minimum 1).
# Files go to
# `screenshots_root/YYYY-MM-DD/<session_id>/HHMMSS_dN.jpg`. Read the privacy
# notes in README.md before enabling.
# screenshots_enabled = true
# screenshots_interval_seconds = 10.0
# screenshots_root = "~/huske/screenshots"
# screenshots_max_displays = 4

# --- Local semantic search + MCP server (opt-in) ---
# Requires the extra: pip install 'huske[mcp]'. When enabled, `huske run`
# embeds each finalized transcript (in an isolated subprocess, off the audio
# hot path) into a local vector index so chat models can search your history
# via `huske mcp`. Off by default — recording pays no embedding cost unless
# you opt in. See README.md → "Search your transcripts from Claude / ChatGPT".
# indexing_enabled = true

# Where the passage index (a single sqlite-vec file) lives.
# index_root = "~/huske/index"

# Local embedding model id (multilingual). Changing this invalidates the index
# — run `huske index --rebuild` afterwards.
# embedding_model = "mlx-community/multilingual-e5-base"

# `huske mcp` daemon bind address. Loopback-only + bearer token by default.
# mcp_host = "127.0.0.1"
# mcp_port = 7641
