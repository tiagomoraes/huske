# Example huske configuration file.
# Copy to ~/.config/huske/config.toml to apply globally; CLI flags still win.
#
# Precedence: built-in defaults < this file < CLI flags.
# The file is optional (silently ignored if absent), and unknown keys are
# rejected — a typo'd key is a config error, not a silent no-op.
# Every value below is shown at its default; uncomment to change it.

# ============================================================
# Recording & chunking
# ============================================================

# Split audio on real pauses in speech instead of a fixed clock (default true).
# A chunk opens when speech is first heard and closes after a pause; silence
# between chunks is never recorded, so a quiet stretch produces no large
# near-empty file and a conversation isn't cut mid-sentence. Set false for the
# legacy fixed-interval rotation.
speech_gated = true

# Seconds of continuous silence that close the current chunk (2–600). Default 60.
silence_split_seconds = 60

# Maximum chunk length in minutes (0.1–60). With speech_gated on this is just a
# safety cap on an unbroken monologue; chunks normally close on a pause.
# 15 min keeps peak RAM (AEC + PCM) bounded on 16–18 GB Macs.
chunk_minutes = 15

# Keep raw WAV chunks after successful transcription (they are deleted by
# default once a chunk is transcribed).
keep_audio = false

# Microphone device name (substring match). Omit for the system default input.
# Falls back to the default mic (with a warning) if unavailable. System audio
# capture is independent of this setting.
# input_device = "MacBook Pro Microphone"

# System audio backend: auto | tap | sck | off
#   auto — Core Audio process tap on macOS 14.4+ (survives screen sharing in
#          Meet/Zoom/etc.), ScreenCaptureKit fallback on older macOS.
#   tap  — force the Core Audio process tap.
#   sck  — force ScreenCaptureKit (can stop during screen sharing).
#   off  — mic only.
system_audio_backend = "auto"

# Advanced capture knobs — rarely changed. Defaults match the recorder.
# sample_rate = 48000   # capture sample rate (Hz)
# block_size  = 1024    # samples per audio callback block
# channels    = 2       # input channel count (1–2; mixed to mono internally)

# ============================================================
# Transcription (on-device, Apple Silicon / MLX)
# ============================================================

# Transcription backend: parakeet | whisper
#   parakeet — NVIDIA Parakeet via parakeet-mlx (default). Multilingual with
#              automatic language detection; as a transducer it emits nothing on
#              silence instead of hallucinating repeated filler.
#   whisper  — legacy mlx-whisper path (uses `model` below + an energy gate).
asr_engine = "parakeet"

# Parakeet model id (HF repo or local dir), used when asr_engine = "parakeet".
parakeet_model = "mlx-community/parakeet-tdt-0.6b-v3"

# Suppress system audio that bleeds into the mic over speakers (no headphones)
# before transcription — coherence-based echo suppression attenuates the mic
# content coherent with the clean system channel. Self-gating (no effect with
# headphones) and never touches your own voice. It reduces rather than fully
# eliminates the bleed (the mic and system are captured on independent clocks,
# so sample-precise cancellation is infeasible); `echo_dedup` removes the rest.
echo_cancel = true

# Remove a mic run that duplicates a near-simultaneous system run — the primary
# fix for the double-counting, matching full lines and partial fragments:
# drop it | annotate (tag it "· echo") | off (keep). One-way: your own voice and
# the clean system line are never removed.
echo_dedup = "drop"

# Whisper model size when asr_engine = "whisper":
# tiny | base | small | medium | large-v3-turbo | large-v3
# For a pinned language (e.g. pt) prefer large-v3-turbo over large-v3.
model = "base"

# Optional language hint, ISO 639-1 (e.g. "pt", "en"). Omit for auto-detect.
# Parakeet auto-detects regardless; this mainly steers the whisper engine.
# language = "pt"

# Compute type — kept for back-compat; the mlx-whisper backend always uses
# Metal. "float32" disables fp16 inference (slower, more memory); any other
# value uses the fp16 default.
compute_type = "int8"

# Inference device — kept for back-compat; mlx-whisper always runs on the
# Apple Silicon GPU. "cuda" is rejected on macOS.
device = "auto"

# Unload the Whisper model from memory between chunks to lower idle RAM. When
# true, the model is dropped after `whisper_idle_unload_seconds` of inactivity
# and reloaded (from the local cache, no network) on the next chunk — freeing
# ~150 MB for `base` up to ~3 GB for `large-v3` while idle. On by default,
# since recording idles far more than it transcribes; the reload costs a few
# seconds on the first chunk after an idle gap. Set this false (or pass
# `huske run --no-idle-unload`) to keep the model warm for back-to-back work.
# whisper_idle_unload = false
# whisper_idle_unload_seconds = 120
# Recycle the ASR process after idle-unload (default true) so macOS can
# reclaim the Metal heap. metal_cache_limit_mb / metal_memory_limit_mb cap
# the MLX buffer cache and evaluation guideline (defaults 512 / 8192).
# recycle_idle_process = true
# metal_cache_limit_mb = 512
# metal_memory_limit_mb = 8192

# ============================================================
# Output & storage paths
# ============================================================

# Day-organized Markdown transcripts.
output_root = "~/huske/transcripts"

# Transient WAV chunks (and the incomplete/ quarantine for unrecoverable ones).
audio_root = "~/huske/audio"

# Per-session log files. Default: ~/huske/logs
# logs_root = "~/huske/logs"

# ============================================================
# Logging & UI
# ============================================================

# Logging: DEBUG | INFO | WARNING | ERROR
log_level = "INFO"

# Run without the Rich live UI (plain log lines instead). Autostart uses this.
no_ui = false

# Show a macOS menu bar icon while recording (macOS only). Default: true.
# The menu bar runs as a separate helper process (~50-80 MB RSS) plus a small
# control socket and accept thread. Set false (or pass `huske run
# --no-menu-bar`) to skip all of it for the lightest recording footprint when
# you don't need the at-a-glance menu bar status.
# menu_bar_enabled = false
# menu_bar_label_style = "text"   # text | icon

# ============================================================
# Screenshots (opt-in; loud — captures every display)
# ============================================================
# Captures a JPEG of every attached display every N seconds, written to
# screenshots_root/YYYY-MM-DD/<session_id>/HHMMSS_dN.jpg. Off by default.
# Read the privacy notes in README.md before enabling.
# screenshots_enabled = false
# screenshots_interval_seconds = 10.0   # 1–3600
# screenshots_max_displays = 4          # 1–16
# screenshots_root = "~/huske/screenshots"

# ============================================================
# Cloud transcript sync (opt-in)
# ============================================================
# Publish finalized Markdown transcripts to a private Git repository. GitHub is
# the documented first provider. SSH is recommended so credentials remain in
# your ssh-agent / macOS Keychain; Huske stores no GitHub token.
# sync_remote = "git@github.com:you/huske-transcripts.git"
# sync_branch = "main"
# sync_root = "~/huske/sync"        # dedicated managed checkout
# sync_push_timeout_seconds = 60
# sync_enabled = false

# Only transcripts/YYYY-MM-DD/*.md is published. Audio, screenshots, logs,
# config, credentials, and local generated state never enter the repository.
# The separate services/huske_mcp package pulls and serves the replica on a VPS.
# See docs/server.md and ADR 0009.

# Where `huske export` writes one Markdown digest per day for file-only tools.
# export_root = "~/huske/export"

# ============================================================
# Transcript correction (opt-in)
# ============================================================
# A tiny local LLM polishes ASR typos in each finished transcript.
# The raw snapshot is kept as <name>.asr.txt next to the .md.
# distill_enabled = false
# distill_backend = "mlx"
# distill_model = "mlx-community/Qwen3.5-0.8B-4bit"   # or Qwen3.5-2B-4bit
# distill_think = false
