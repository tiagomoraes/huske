name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: Publish the built distributions to PyPI
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  build-app:
    name: Build Huske.app
    runs-on: macos-15

    # Signing and notarization are opt-in on secrets, all five or none: a
    # fork, or this repo before the credentials exist, must still produce the
    # same asset under the same name. An unsigned app is worse than a notarized
    # one, but a failed release is worse than both — which is why verifying the
    # published asset is a step in docs/RELEASE_PLAYBOOK.md. The secret setup is
    # in docs/releasing.md.
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # A throwaway keychain, created and deleted inside this job. The runner's
      # default keychain is shared state we have no business writing to.
      - name: Import Developer ID certificate
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN="$RUNNER_TEMP/huske-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          CERT="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -x
          # Without a partition list, codesign blocks on a UI prompt that
          # nobody can answer on a runner.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # build-app.sh looks the identity up with `security find-identity`,
          # which only searches the user search list.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT"
          echo "HUSKE_CODESIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(Developer ID Application[^"]*\)".*/imported: \1/p'

      - name: Build and package Huske.app
        run: ./macos/scripts/build-app.sh

      # Stable asset name — the website's download button points at
      # releases/latest/download/Huske.app.zip. The ticket staples to the .app,
      # so the zip is produced after stapling, not before.
      - name: Notarize, staple, and zip the app bundle
        if: env.MACOS_CERTIFICATE_P12 != '' && env.MACOS_CERTIFICATE_PASSWORD != '' && env.APPLE_API_KEY_P8 != '' && env.APPLE_API_KEY_ID != '' && env.APPLE_API_ISSUER_ID != ''
        run: |
          set -euo pipefail
          umask 077
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$KEY"
          HUSKE_ASC_KEY_PATH="$KEY" \
          HUSKE_ASC_KEY_ID="$APPLE_API_KEY_ID" \
          HUSKE_ASC_ISSUER_ID="$APPLE_API_ISSUER_ID" \
            ./macos/scripts/notarize-app.sh --output "$GITHUB_WORKSPACE/Huske.app.zip"

      # Same asset, ad-hoc signed, when the credentials are not configured.
      - name: Zip the app bundle (unsigned)
        if: env.MACOS_CERTIFICATE_P12 == '' || env.MACOS_CERTIFICATE_PASSWORD == '' || env.APPLE_API_KEY_P8 == '' || env.APPLE_API_KEY_ID == '' || env.APPLE_API_ISSUER_ID == ''
        run: ditto -c -k --keepParent macos/dist/Huske.app Huske.app.zip

      - name: Clean up signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/certificate.p12"
          if [ -n "${HUSKE_CODESIGN_KEYCHAIN:-}" ]; then
            security delete-keychain "$HUSKE_CODESIGN_KEYCHAIN" || true
          fi

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: huske-app
          path: Huske.app.zip
          if-no-files-found: error

  attach-github-assets:
    name: Attach GitHub release assets
    if: ${{ github.event_name == 'release' }}
    needs:
      - build
      - build-app
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist

      - name: Download app artifact
        uses: actions/download-artifact@v8
        with:
          name: huske-app
          path: app

      - name: Upload distributions to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
          gh release upload "${GITHUB_REF_NAME}" app/Huske.app.zip --clobber --repo "${GITHUB_REPOSITORY}"

  publish-pypi:
    name: Publish to PyPI
    if: ${{ github.event_name == 'release' || inputs.publish_pypi == true }}
    needs:
      - build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
