name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system audio libraries
        run: brew install portaudio libsndfile

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Unit tests
        run: pytest tests/unit

      - name: Fast integration tests
        run: pytest tests/integration/test_pipeline_no_whisper.py tests/integration/test_smoke.py

  # Ruff and mypy were configured but only ever run by hand, which meant "clean"
  # depended on whoever remembered. Both are clean as of 0.11.1, so they gate now.
  #
  # Note mypy sees a *different* codebase than a dev with the optional extras
  # installed: `dev` does not include `mcp`, so `import mcp` resolves to Any here
  # and `@mcp.tool()` reads as an untyped decorator. That is why those ignores
  # carry `unused-ignore` as well — the ignore is needed here and redundant on a
  # machine with `.[mcp]`, and the pair is stable in both.
  quality:
    name: Lint & types
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install system audio libraries
        run: brew install portaudio libsndfile

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy huske

  swift:
    name: macOS app (Swift)
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build
        working-directory: macos

      - name: Tests
        run: swift test
        working-directory: macos

      # The app is a client of the Python engine, so the two can drift apart
      # silently: a field added to huske/ipc/protocol.py and not mirrored in
      # ControlProtocol.swift only surfaces at runtime, on a user's machine.
      # PythonInteropTests drives the real ControlServer with the Swift client
      # and is skipped unless HUSKE_INTEROP_PYTHON is set — which nothing set,
      # so the one test that catches drift never ran.
      - name: Set up Python for the interop contract
        id: interop-python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # The ControlServer half of the contract is stdlib-only, but the second
      # half (`huske setup --json`, which the app's Connect pane renders) goes
      # through the Typer CLI and the Pydantic config — so those three wheels
      # are needed. Deliberately NOT `-e ".[dev]"`: that would pull the MLX
      # stack onto the Swift runner for a JSON-shape check. Nothing here needs
      # the `[mcp]` extra either; its absence is a state the report models.
      - name: Minimal deps for the interop contract
        run: python -m pip install --quiet pydantic typer pyyaml

      # The test spawns this via Foundation's Process, which does not search
      # PATH — it must be an absolute interpreter path.
      - name: Cross-language contract (Swift client ↔ Python ControlServer)
        run: swift test --filter PythonInterop
        working-directory: macos
        env:
          HUSKE_INTEROP_PYTHON: ${{ steps.interop-python.outputs.python-path }}
          PYTHONPATH: ${{ github.workspace }}

      - name: Package Huske.app
        run: ./scripts/build-app.sh
        working-directory: macos

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: Huske.app
          path: macos/dist/Huske.app
          if-no-files-found: error
